name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi

          CURRENT="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BRANCH="${{ github.event.pull_request.head.ref }}"
          case "$BRANCH" in
            feature/*)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            fix/*)
              PATCH=$((PATCH + 1))
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST -> $NEXT (branch: $BRANCH)"

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Install osslsigncode
        run: sudo apt-get update && sudo apt-get install -y osslsigncode

      - name: Build Windows artifacts
        run: make build-windows

      - name: Sign Windows artifacts
        if: env.CODE_SIGN_PFX != ''
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASS: ${{ secrets.CODE_SIGN_PASS }}
        run: |
          echo "$CODE_SIGN_PFX" | base64 -d > dist/cert.pfx
          osslsigncode sign -pkcs12 dist/cert.pfx -pass "$CODE_SIGN_PASS" \
            -n "lol-telemetry" -i "https://github.com/rafael-macedo/lol-telemetry" \
            -in dist/lol-cli.exe -out dist/lol-cli.exe.signed
          osslsigncode sign -pkcs12 dist/cert.pfx -pass "$CODE_SIGN_PASS" \
            -n "lol-telemetry" -i "https://github.com/rafael-macedo/lol-telemetry" \
            -in dist/lol-daemon.exe -out dist/lol-daemon.exe.signed
          mv dist/lol-cli.exe.signed dist/lol-cli.exe
          mv dist/lol-daemon.exe.signed dist/lol-daemon.exe
          rm -f dist/cert.pfx
          echo "Artifacts signed"

      - name: Package zip
        run: cd dist && zip -9 lol-telemetry-windows-amd64.zip lol-cli.exe lol-daemon.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/lol-telemetry-windows-amd64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
