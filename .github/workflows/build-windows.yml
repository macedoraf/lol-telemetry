name: Build Windows Artifact

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Install osslsigncode
        run: sudo apt-get update && sudo apt-get install -y osslsigncode

      - name: Build Windows artifacts
        run: make build-windows

      - name: Sign Windows artifacts
        if: env.CODE_SIGN_PFX != ''
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASS: ${{ secrets.CODE_SIGN_PASS }}
        run: |
          echo "$CODE_SIGN_PFX" | base64 -d > dist/cert.pfx
          osslsigncode sign -pkcs12 dist/cert.pfx -pass "$CODE_SIGN_PASS" \
            -n "lol-telemetry" -i "https://github.com/rafael-macedo/lol-telemetry" \
            -in dist/lol-cli.exe -out dist/lol-cli.exe.signed
          osslsigncode sign -pkcs12 dist/cert.pfx -pass "$CODE_SIGN_PASS" \
            -n "lol-telemetry" -i "https://github.com/rafael-macedo/lol-telemetry" \
            -in dist/lol-daemon.exe -out dist/lol-daemon.exe.signed
          mv dist/lol-cli.exe.signed dist/lol-cli.exe
          mv dist/lol-daemon.exe.signed dist/lol-daemon.exe
          rm -f dist/cert.pfx
          echo "Artifacts signed"

      - name: Package zip
        run: cd dist && zip -9 lol-telemetry-windows-amd64.zip lol-cli.exe lol-daemon.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol-telemetry-windows-amd64
          path: dist/lol-telemetry-windows-amd64.zip
          if-no-files-found: error
