name: Build Windows Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Build Windows artifact
        run: make build-windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol-cli-windows
          path: dist/lol-cli.exe
          if-no-files-found: error
